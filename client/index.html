    <!--
      Umami analytics was here. Neither VITE_ANALYTICS_ENDPOINT nor
      VITE_ANALYTICS_WEBSITE_ID is set in this project, so the tag shipped with
      its placeholders unreplaced and requested a literal
      "/%VITE_ANALYTICS_­ENDPOINT%/umami", a 404 and a console error on every
      single page load, measuring nothing.

      To re-enable: set both variables in the environment, then restore
      a script tag with src="%VITE_ANALYTICS_­ENDPOINT%/umami" and
      data-website-id="%VITE_ANALYTICS_­WEBSITE_ID%" (removing the soft hyphen
      this comment carries so Vite does not try to substitute them here).
    -->
  </body>
